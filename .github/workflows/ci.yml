name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL for Prisma Client generation only — no database connection is made in CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_HTTP_BACKEND: http://localhost:3002
  NEXT_PUBLIC_WS_URL: ws://localhost:8080

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db exec prisma generate

      - name: Typecheck workspace
        run: pnpm check-types

      - name: Build @repo/db
        run: pnpm --filter @repo/db build

      - name: Build @repo/common
        run: pnpm --filter @repo/common build

      - name: Build HTTP backend
        run: pnpm --filter http-backend build

      - name: Build WebSocket backend
        run: pnpm --filter ws-backend build

      - name: Build Next.js frontend
        run: pnpm --filter draw build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build HTTP backend image
        run: docker build -f apps/http-backend/Dockerfile .

      - name: Build WebSocket backend image
        run: docker build -f apps/ws-backend/Dockerfile .

      - name: Build frontend image
        run: |
          docker build \
            -f apps/draw/Dockerfile \
            --build-arg NEXT_PUBLIC_HTTP_BACKEND=http://localhost:3002 \
            --build-arg NEXT_PUBLIC_WS_URL=ws://localhost:8080 \
            .
